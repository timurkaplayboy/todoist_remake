{% extends 'base.html' %}

{% block content %}

<section class="page-header compact">
    <div>
        <p class="eyebrow">Task setup</p>
        <h1>{% if object %}Edit task{% else %}Create task{% endif %}</h1>
    </div>
    <a href="{% url 'task_list' %}" class="btn btn-outline-light btn-sm">Back</a>
</section>

<form method="post" class="editor-panel">
    {% csrf_token %}

    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="invalid-feedback d-block">{{ field.errors|join:', ' }}</div>
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'task_list' %}" class="btn btn-link text-decoration-none">Cancel</a>
</form>

{% endblock %}
